services:
  postgres:
    image: postgres:16-alpine
    container_name: whattoeat-db
    environment:
      POSTGRES_DB: whattoeat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "8432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./src/WhatToEat.API
      dockerfile: Dockerfile
    container_name: whattoeat-web
    ports:
      - "8089:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=whattoeat;Username=postgres;Password=postgres
      - YelpApi__ApiKey=${YELP_API_KEY:-YOUR_YELP_API_KEY_HERE}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
